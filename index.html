<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A E S T H E T I C • Group Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff71ce;
      --secondary: #01cdfe;
      --accent: #05ffa1;
      --bg: #0d0221;
      --card-bg: rgba(26, 16, 60, 0.75);
      --text: #fffbfe;
      --text-muted: #b9aed9;
      --border: #b967ff;
      --input-bg: rgba(13, 2, 33, 0.8);
      --danger: #ff5277;
      --radius: 12px;
      --grid-color: rgba(255, 113, 206, 0.15);
      --glow: 0 0 12px rgba(255, 113, 206, 0.6);
      --male-color: #01cdfe;
      --female-color: #ff71ce;
      --neutral-color: #05ffa1;
    }

    [data-theme="light"] {
      --primary: #d9008f;
      --secondary: #0077ff;
      --accent: #00b874;
      --bg: #f3ebf9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #2a0845;
      --text-muted: #6b5284;
      --border: #d9008f;
      --input-bg: #ffffff;
      --danger: #e60039;
      --grid-color: rgba(217, 0, 143, 0.12);
      --glow: 0 0 10px rgba(217, 0, 143, 0.3);
      --male-color: #0077ff;
      --female-color: #d9008f;
      --neutral-color: #00b874;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
      background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 30px 30px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      color: var(--primary);
      text-shadow: 2px 2px 0px var(--secondary), -2px -2px 0px #05ffa1;
      margin-bottom: 1rem;
      letter-spacing: -1px;
      line-height: 1.4;
    }

    header p {
      color: var(--secondary);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: var(--glow);
    }

    .theme-toggle-btn {
      position: absolute;
      top: -10px;
      right: 0;
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 0.5rem 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: var(--glow);
      transition: all 0.2s;
      z-index: 20;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.05);
      border-color: var(--accent);
    }

    @media (max-width: 640px) {
      .theme-toggle-btn {
        position: static;
        margin: 0 auto 1rem;
        display: inline-flex;
      }
    }

    .app-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .app-layout {
        grid-template-columns: 360px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      box-shadow: var(--glow), inset 0 0 15px rgba(185, 103, 255, 0.15);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--secondary);
      text-transform: uppercase;
    }

    textarea, input, select {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--input-bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .row-btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .row-btn-group .btn,
    .row-btn-group .btn-danger {
      width: auto;
      flex: 1;
      min-width: 0;
    }

    .radio-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #b967ff);
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px var(--primary);
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px var(--primary);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      box-shadow: none;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border: 2px solid var(--danger);
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #ffffff;
      box-shadow: 0 0 12px var(--danger);
    }

    /* ===== Student Roster Manager ===== */
    .student-manager-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.75rem;
      margin-bottom: 0.4rem;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }
    .student-manager-header #studentManagerSummary {
      text-transform: uppercase;
    }
    .student-manager-bulk {
      display: flex;
      gap: 0.35rem;
    }
    .student-manager-bulk .row-toggle {
      padding: 0.15rem 0.55rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border);
      color: var(--text);
      background: transparent;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.15s;
    }
    .student-manager-bulk .row-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .student-manager {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      max-height: 320px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .student-manager .empty-msg {
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 0.75rem;
      text-align: center;
    }

    .student-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.5rem;
      background: rgba(13, 2, 33, 0.35);
      border: 1px solid transparent;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 700;
      transition: opacity 0.15s, background-color 0.15s;
    }
    [data-theme="light"] .student-row {
      background: rgba(0, 0, 0, 0.03);
    }

    .student-row.excluded {
      opacity: 0.42;
    }
    .student-row.excluded .row-name {
      text-decoration: line-through;
      text-decoration-thickness: 2px;
    }

    .row-color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 6px currentColor, inset 0 0 2px rgba(255,255,255,0.6);
    }

    .row-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .row-gender {
      padding: 0.15rem 0.5rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid;
      user-select: none;
      transition: all 0.15s;
      flex-shrink: 0;
      background: transparent;
      font-family: inherit;
    }
    .row-gender:hover {
      transform: scale(1.08);
    }
    .row-gender.male {
      color: var(--male-color);
      border-color: var(--male-color);
      background: rgba(1, 205, 254, 0.15);
    }
    .row-gender.female {
      color: var(--female-color);
      border-color: var(--female-color);
      background: rgba(255, 113, 206, 0.15);
    }
    .row-gender.unspecified {
      color: var(--neutral-color);
      border-color: var(--neutral-color);
      background: rgba(5, 255, 161, 0.15);
    }

    .row-toggle {
      padding: 0.15rem 0.55rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--accent);
      color: var(--accent);
      background: transparent;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.15s;
      flex-shrink: 0;
      font-family: inherit;
      min-width: 70px;
    }
    .row-toggle:hover {
      background: var(--accent);
      color: var(--bg);
      box-shadow: 0 0 8px var(--accent);
    }
    .student-row.excluded .row-toggle {
      border-color: var(--danger);
      color: var(--danger);
    }
    .student-row.excluded .row-toggle:hover {
      background: var(--danger);
      color: #ffffff;
      box-shadow: 0 0 8px var(--danger);
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .group-card {
      background: var(--card-bg);
      border: 2px solid var(--secondary);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 0 10px var(--secondary);
      transition: all 0.3s;
    }

    .group-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 20px var(--secondary);
    }

    .group-card h3 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: var(--primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .group-card ul {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .student-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      background-color: var(--input-bg);
      border-left: 5px solid var(--student-color, transparent);
      box-shadow:
        inset 0 0 5px rgba(255, 255, 255, 0.05),
        -2px 0 8px var(--student-color, transparent);
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .student-info span:last-child {
      overflow-wrap: anywhere;
    }

    .student-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      background-color: var(--student-color, currentColor);
      box-shadow: 0 0 6px var(--student-color, currentColor);
    }

    .gender-icon {
      font-size: 0.85rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .actions-bar h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 1.1rem;
    }

    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 1.25rem 0;
    }

    /* Google Classroom Styles */
    .classroom-status {
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 0.5rem;
      padding: 0.4rem;
      border-radius: 4px;
      text-align: center;
    }
    .classroom-status.connected {
      color: var(--accent);
      background: rgba(5, 255, 161, 0.1);
    }
    .classroom-status.disconnected {
      color: var(--text-muted);
      background: rgba(185, 103, 255, 0.1);
    }
    .classroom-course-list {
      margin-top: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .classroom-course-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0.75rem;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .classroom-course-item:hover {
      border-color: var(--accent);
      background: rgba(5, 255, 161, 0.1);
    }
    .classroom-course-item.loading {
      opacity: 0.6;
      pointer-events: none;
    }
    .classroom-course-item .course-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .classroom-course-item .import-icon {
      font-size: 1rem;
      flex-shrink: 0;
      margin-left: 0.5rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn" type="button">
        🌴 Switch to Light
      </button>
      <h1>R A N D O M • G R O U P S</h1>
      <p>// A E S T H E T I C • R O S T E R • S H U F F L E R</p>
    </header>

    <div class="app-layout">
      <!-- Input Panel -->
      <div class="card">
        
        <!-- Google Classroom Import -->
        <div class="form-group">
          <label>Import from Google Classroom:</label>
          <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem;" onclick="handleGoogleClassroomAuth()" id="googleClassroomBtn" type="button">
            🔗 Connect to Google Classroom
          </button>
          <div id="classroomStatus" class="classroom-status disconnected">
            Not connected
          </div>
          <div id="classroomCourseList" class="classroom-course-list" style="display: none;"></div>
        </div>

        <div class="divider"></div>

        <!-- Saved Classes Manager -->
        <div class="form-group">
          <label for="classSelect">Saved Rosters:</label>
          <select id="classSelect" onchange="loadClass()">
            <option value="">-- Select Class --</option>
          </select>
          <div class="row-btn-group" id="classActionButtons" style="display: none;">
            <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem;" onclick="updateClass()" type="button">Update Roster</button>
            <button class="btn-danger" style="font-size: 0.85rem; padding: 0.5rem;" onclick="deleteClass()" type="button">Delete</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label for="studentList">Student Names:</label>
          <textarea id="studentList" placeholder="Liam, Olivia, Noah, Emma, Oliver, Charlotte&#10;James, Amelia, Elijah, Sophia" oninput="onStudentInput()"></textarea>
          
          <div class="row-btn-group">
            <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem;" onclick="saveNewClass()" type="button">💾 Save Class Roster</button>
          </div>
        </div>

        <!-- Student Roster Manager (Colors / Gender / Inclusion) -->
        <div class="form-group">
          <label>Roster Manager:</label>
          <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem;" onclick="toggleStudentManager()" type="button" id="studentManagerToggleBtn">
            🎨 Review Colors • Gender • Inclusion
          </button>
          
          <div id="studentManagerPanel" style="display: none;">
            <div class="student-manager-header">
              <span id="studentManagerSummary">0 of 0 included</span>
              <div class="student-manager-bulk">
                <button class="row-toggle" onclick="includeAllStudents()" type="button">Include All</button>
                <button class="row-toggle" onclick="excludeAllStudents()" type="button">Exclude All</button>
              </div>
            </div>
            <div class="student-manager" id="studentManagerContainer"></div>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem; text-align: center;">
              Click the gender badge to cycle ♂ → ♀ → ⚧. Click <strong>Include</strong> / <strong>Excluded</strong> to control who joins the groups.
            </p>
          </div>

          <label class="checkbox-label">
            <input type="checkbox" id="balanceGenders" checked> Balance Genders Across Groups
          </label>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label>Grouping Mode:</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="mode" value="numGroups" checked onchange="toggleMode()"> Total Groups
            </label>
            <label class="radio-label">
              <input type="radio" name="mode" value="groupSize" onchange="toggleMode()"> Group Size
            </label>
          </div>
        </div>

        <div class="form-group">
          <label id="numberLabel" for="numberInput">Number of Groups:</label>
          <input type="number" id="numberInput" min="1" value="2">
        </div>

        <button class="btn" onclick="generateGroups()" type="button">⚡ Generate Groups</button>
      </div>

      <!-- Results Panel -->
      <div>
        <div class="actions-bar" id="actionsBar" style="display: none;">
          <h2 id="totalCount">GROUPS</h2>
          <button class="btn btn-secondary" style="width: auto; margin-top: 0; padding: 0.6rem 1rem;" onclick="copyGroups()" type="button">📋 Copy Results</button>
        </div>

        <div id="resultsContainer">
          <div class="card empty-state">
            <p>Load a roster or enter student names, then hit <strong>GENERATE GROUPS</strong>.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Google API Client Library -->
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script>
    // ============================================================
    // GOOGLE CLASSROOM CONFIGURATION
    // ============================================================
    // Replace with your own OAuth 2.0 Client ID from Google Cloud Console.
    const GOOGLE_CLASSROOM_CLIENT_ID = 'YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com';

    const CLASSROOM_SCOPES = [
      'https://www.googleapis.com/auth/classroom.courses.readonly',
      'https://www.googleapis.com/auth/classroom.rosters.readonly'
    ].join(' ');

    let tokenClient = null;
    let accessToken = null;
    let gapiInitialized = false;
    let gapiReady = false;

    // ============================================================
    // GOOGLE CLASSROOM: INITIALIZATION
    // ============================================================
    function initializeGoogleClassroom() {
      if (typeof gapi === 'undefined') {
        console.warn('Google API client library not loaded yet.');
        return;
      }

      gapi.load('client', async () => {
        try {
          await gapi.client.init({});
          await gapi.client.load('classroom', 'v1');
          gapiInitialized = true;
          gapiReady = true;
          console.log('Google Classroom API client initialized.');
          updateClassroomButtonState();
        } catch (err) {
          console.error('Error initializing Google Classroom API:', err);
        }
      });
    }

    window.addEventListener('load', () => {
      loadGISLibrary();
      initializeGoogleClassroom();
    });

    function loadGISLibrary() {
      const script = document.createElement('script');
      script.src = 'https://accounts.google.com/gsi/client';
      script.async = true;
      script.defer = true;
      script.onload = () => {
        console.log('Google Identity Services library loaded.');
        initializeTokenClient();
      };
      script.onerror = () => {
        console.error('Failed to load Google Identity Services library.');
      };
      document.head.appendChild(script);
    }

    function initializeTokenClient() {
      if (typeof google === 'undefined' || !google.accounts || !google.accounts.oauth2) {
        console.warn('Google Identity Services not available yet.');
        return;
      }

      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLASSROOM_CLIENT_ID,
        scope: CLASSROOM_SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            console.log('Access token obtained.');
            updateClassroomStatus('connected', '✅ Connected to Google Classroom');
            loadClassroomCourses();
          } else {
            console.error('Token response did not contain an access token:', tokenResponse);
            updateClassroomStatus('disconnected', '❌ Authentication failed');
          }
        },
        error_callback: (err) => {
          console.error('OAuth error:', err);
          updateClassroomStatus('disconnected', '❌ Authentication error');
        }
      });
    }

    function handleGoogleClassroomAuth() {
      if (accessToken) {
        disconnectGoogleClassroom();
        return;

      if (!tokenClient) {
        alert(
          'Google Classroom integration is not ready yet.\n\n' +
          'Please make sure you have:\n' +
          '1. Created an OAuth 2.0 Client ID in the Google Cloud Console.\n' +
          '2. Replaced the placeholder GOOGLE_CLASSROOM_CLIENT_ID in the code.\n' +
          '3. Authorized your JavaScript origin.'
        );
        return;
      }

      if (GOOGLE_CLASSROOM_CLIENT_ID === 'YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com') {
        alert(
          'Please configure your Google OAuth 2.0 Client ID.\n\n' +
          'Open the source code and replace:\n' +
          'const GOOGLE_CLASSROOM_CLIENT_ID = \'YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com\';\n\n' +
          'with your actual Client ID from the Google Cloud Console.'
        );
        return;
      }

      tokenClient.requestAccessToken({ prompt: 'consent' });

    // ============================================================

    // ============================================================
    async function loadClassroomCourses() {
      const courseListEl = document.getElementById('classroomCourseList');
      courseListEl.style.display = 'block';
      courseListEl.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:0.5rem;">Loading courses…</div>';

      try {
        if (!gapiReady) {
          throw new Error('Google API client is not ready. Please try again in a moment.');
        }

        const response = await gapi.client.classroom.courses.list({
          courseState: 'ACTIVE',
          pageSize: 50,
          teacherId: 'me'
        });

        const courses = response.result.courses || [];

        if (courses.length === 0) {
          courseListEl.innerHTML = '<div style="color:var(--text-muted); font-size:0.85rem; text-align:center; padding:0.5rem;">No active courses found.</div>';
          return;
        }

        courseListEl.innerHTML = courses.map(course => `
          <div class="classroom-course-item" data-course-id="${escapeHtml(course.id)}" onclick="importClassroomCourse(this, '${escapeHtml(course.id)}', '${escapeHtml(course.name)}')">
            <span class="course-name" title="${escapeHtml(course.name)}">${escapeHtml(course.name)}</span>
            <span class="import-icon">📥</span>
          </div>
        `).join('');

      } catch (err) {
        console.error('Error fetching courses:', err);
        courseListEl.innerHTML = `<div style="color:var(--danger); font-size:0.85rem; text-align:center; padding:0.5rem;">Error: ${escapeHtml(err.message || 'Failed to load courses')}</div>`;
      }
    }

    // ============================================================
    // GOOGLE CLASSROOM: IMPORT STUDENTS FROM A COURSE
    // ============================================================
    async function importClassroomCourse(el, courseId, courseName) {
      if (!accessToken) {
        alert('Please connect to Google Classroom first.');
        return;
      }

      el.classList.add('loading');
      const originalContent = el.innerHTML;
      el.innerHTML = `<span class="course-name">Importing "${escapeHtml(courseName)}"…</span><span class="import-icon">⏳</span>`;

      try {
        if (!gapiReady) {
          throw new Error('Google API client is not ready.');
        }

        const response = await gapi.client.classroom.courses.students.list({
          courseId: courseId,
          pageSize: 100
        });

        const students = response.result.students || [];

        if (students.length === 0) {
          el.classList.remove('loading');
          el.innerHTML = originalContent;
          alert(`No students found in "${courseName}".`);
          return;
        }

        const studentNames = students
          .map(s => s.profile && s.profile.name && s.profile.name.fullName)
          .filter(name => name && name.trim().length > 0);

        if (studentNames.length === 0) {
          el.classList.remove('loading');
          el.innerHTML = originalContent;
          alert(`No student names could be extracted from "${courseName}".`);
          return;
        }

        const textarea = document.getElementById('studentList');
        const existing = textarea.value.trim();

        if (existing.length > 0) {
          const existingNames = parseStudentNames(existing);
          if (!confirm(`This will replace the current roster (${existingNames.length} student${existingNames.length !== 1 ? 's' : ''}) with ${studentNames.length} student${studentNames.length !== 1 ? 's' : ''} from "${courseName}".\n\nContinue?`)) {
            el.classList.remove('loading');
            el.innerHTML = originalContent;
            return;
          }
        }

        textarea.value = studentNames.join(', ');

        // Fresh import — reset exclusions and let gender map rebuild
        excludedStudents = new Set();
        studentGenderMap = {};
        syncGenderMap(studentNames);

        // Auto-open the roster manager so the user can verify colors / gender / inclusion
        openStudentManager();

        el.classList.remove('loading');
        el.innerHTML = `<span class="course-name">✅ ${escapeHtml(courseName)}</span><span class="import-icon">✔️</span>`;

        const className = courseName.trim();
        if (className) {
          const classes = getSavedClasses();
          classes[className] = {
            students: studentNames,
            genders: studentGenderMap,
            excluded: []
          };
          localStorage.setItem('classRosters', JSON.stringify(classes));
          renderClassDropdown();
          document.getElementById('classSelect').value = className;
          toggleActionButtons();
          console.log(`Auto-saved roster: "${className}"`);
        }

        updateClassroomStatus('connected', `✅ Imported "${courseName}" (${studentNames.length} students)`);

        setTimeout(() => {
          if (el.classList.contains('loading')) return;
          el.innerHTML = originalContent;
        }, 3000);

      } catch (err) {
        console.error('Error importing course students:', err);
        el.classList.remove('loading');
        el.innerHTML = originalContent;

        let errorMsg = err.message || 'Failed to import students.';
        if (err.status === 403) {
          errorMsg = 'Permission denied. Make sure you have access to this course and that the Classroom API is enabled.';
        } else if (err.status === 404) {
          errorMsg = 'Course not found. It may have been deleted.';
        }

        alert(`Error importing "${courseName}":\n\n${errorMsg}`);
      }
    }

    let studentGenderMap = {};

    function autoDetectGender(name) {
      const firstName = name.trim().split(/\s+/)[0].toLowerCase();
      if (MALE_NAMES.has(firstName)) return 'male';
      if (FEMALE_NAMES.has(firstName)) return 'female';
      if (HEURISTIC_OVERRIDES[firstName]) return HEURISTIC_OVERRIDES[firstName];

      if (firstName.endsWith('ette') || firstName.endsWith('ina') || firstName.endsWith('ella')) return 'female';
      if (firstName.endsWith('son') && firstName.length > 4) return 'male';

      return 'unspecified';
    }

    function syncGenderMap(students) {
      const newMap = {};
      const studentSet = new Set(students);
      students.forEach(student => {
        newMap[student] = studentGenderMap[student] || autoDetectGender(student);
      });
      studentGenderMap = newMap;

      // Drop exclusions for students that are no longer in the roster
      const newExcluded = new Set();
      excludedStudents.forEach(name => {
        if (studentSet.has(name)) newExcluded.add(name);
      });
      excludedStudents = newExcluded;

      renderStudentManager();
    }

    function renderStudentManager() {
      const container = document.getElementById('studentManagerContainer');
      const summary = document.getElementById('studentManagerSummary');
      const students = parseStudentNames(document.getElementById('studentList').value);
      const currentClass = document.getElementById('classSelect').value || 'default';

        container.innerHTML = '<div class="empty-msg">No students entered yet.</div>';

      if (summary) {
        summary.textContent = `${includedCount} of ${students.length} included`;
      }

      container.innerHTML = students.map((student, index) => {
        const gender = studentGenderMap[student] || 'unspecified';
        const symbol = gender === 'male' ? '♂' : gender === 'female' ? '♀' : '⚧';
        // Same derivation as the group output — what you see here is what will render.
        const color = stringToColor(`${currentClass}:${student.toLowerCase()}`);
        const isExcluded = excludedStudents.has(student);

        return `
          <div class="student-row ${isExcluded ? 'excluded' : ''}" data-index="${index}">
            <span class="row-color-dot" style="background-color: ${color}; color: ${color};" title="Assigned color: ${escapeHtml(color)}"></span>
            <span class="row-name">${escapeHtml(student)}</span>
            <button class="row-gender ${gender}" data-action="cycle-gender" type="button" title="Click to cycle: male → female → unspecified">
              ${symbol}
            </button>
            <button class="row-toggle" data-action="toggle-inclusion" type="button" title="Toggle whether this student joins the groups">
              ${isExcluded ? 'Excluded' : 'Include'}

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('studentManagerContainer').addEventListener('click', (event) => {
        const button = event.target.closest('[data-action]');
        if (!button) return;
        const row = button.closest('.student-row');
        if (!row) return;
        const index = parseInt(row.dataset.index, 10);
        if (Number.isNaN(index)) return;

        const action = button.dataset.action;
        if (action === 'cycle-gender') {
          cycleGenderByIndex(index);
        } else if (action === 'toggle-inclusion') {
          toggleInclusionByIndex(index);
        }
      });

    function cycleGenderByIndex(index) {
      const students = parseStudentNames(document.getElementById('studentList').value);
      const student = students[index];
      if (!student) return;

      const current = studentGenderMap[student] || 'unspecified';
      const next = current === 'male' ? 'female' : current === 'female' ? 'unspecified' : 'male';
      studentGenderMap[student] = next;
      renderStudentManager();
    }

    function toggleInclusionByIndex(index) {
      const students = parseStudentNames(document.getElementById('studentList').value);
      const student = students[index];
      if (!student) return;

      if (excludedStudents.has(student)) {
        excludedStudents.delete(student);

    // ============================================================
    // HELPER FUNCTIONS
    // ============================================================
    function parseStudentNames(text) {
      return text
        .split(/[\n,]+/)
        .map(s => s.trim())
        .filter(s => s.length > 0);
    }

    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash * 137.508) % 360;
      return `hsl(${hue}, 100%, 65%)`;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // ============================================================
    // GROUP GENERATOR LOGIC
    // ============================================================
    function toggleMode() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const label = document.getElementById('numberLabel');
      const input = document.getElementById('numberInput');

      if (mode === 'numGroups') {
        label.textContent = 'Number of Groups:';
        input.value = 2;
      } else {
        label.textContent = 'Students per Group:';
        input.value = 3;
      }
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateGroups() {
      const allStudents = parseStudentNames(document.getElementById('studentList').value);

      if (allStudents.length === 0) {
        alert('Please enter at least one student name.');
        return;
      }

      // Keep gender/exclusion state fresh with current textarea contents
      syncGenderMap(allStudents);

      // Filter out excluded students
      const students = allStudents.filter(s => !excludedStudents.has(s));
      const excludedCount = allStudents.length - students.length;

      if (students.length === 0) {
        alert('All students are currently excluded. Please include at least one student before generating groups.');
        return;
      }

      const mode = document.querySelector('input[name="mode"]:checked').value;
      const targetVal = parseInt(document.getElementById('numberInput').value, 10);

      if (!targetVal || targetVal <= 0) {
        alert('Please enter a valid positive number.');
        return;
      }

      const balanceGender = document.getElementById('balanceGenders').checked;

      const groups = [];
      let numGroups;

      if (mode === 'groupSize') {
        numGroups = Math.max(1, Math.ceil(students.length / targetVal));
      } else {
        numGroups = Math.min(targetVal, students.length);
      }

      for (let i = 0; i < numGroups; i++) {
        groups.push([]);
      }

      if (balanceGender) {
        const males = shuffle(students.filter(s => (studentGenderMap[s] || 'unspecified') === 'male'));
        const females = shuffle(students.filter(s => (studentGenderMap[s] || 'unspecified') === 'female'));
        const unspecified = shuffle(students.filter(s => (studentGenderMap[s] || 'unspecified') === 'unspecified'));

        let groupIdx = 0;
        [males, females, unspecified].forEach(categoryList => {
          categoryList.forEach(student => {
            groups[groupIdx % numGroups].push(student);
            groupIdx++;
          });
        });
      } else {
        const shuffled = shuffle(students);
        shuffled.forEach((student, index) => {
          groups[index % numGroups].push(student);
        });
      }

      renderGroups(groups, { excludedCount, totalCount: allStudents.length });
    }

    function renderGroups(groups, meta = {}) {
      const container = document.getElementById('resultsContainer');
      const actionsBar = document.getElementById('actionsBar');
      const totalCount = document.getElementById('totalCount');
      const currentClass = document.getElementById('classSelect').value || 'default';

      if (meta.excludedCount && meta.excludedCount > 0) {
        countText += ` • ${meta.excludedCount} EXCLUDED`;
      }
      totalCount.textContent = countText;

      let html = '<div class="groups-grid">';

      groups.forEach((group, index) => {
        const groupNumber = String(index + 1).padStart(2, '0');

        const membersHtml = group.map(student => {
          const color = stringToColor(`${currentClass}:${student.toLowerCase()}`);
          const gender = studentGenderMap[student] || 'unspecified';
          const icon = gender === 'male' ? '♂' : gender === 'female' ? '♀' : '⚧';
          const colorVar = gender === 'male' ? 'male-color'
                        : gender === 'female' ? 'female-color'
                        : 'neutral-color';

          return `
            <li class="student-badge" style="--student-color: ${color};">
              <div class="student-info">
                <span class="student-color-dot"></span>
                <span>${escapeHtml(student)}</span>
              </div>
              <span class="gender-icon" style="color: var(--${colorVar});">
                ${icon}
              </span>
            </li>
          `;
        }).join('');

        html += `
          <div class="group-card">
            <h3>GROUP ${groupNumber}</h3>
            <ul>${membersHtml}</ul>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function copyGroups() {
      const groupCards = document.querySelectorAll('.group-card');
      if (groupCards.length === 0) return;

      let text = '';
      groupCards.forEach(card => {
        const title = card.querySelector('h3').innerText;
        const members = Array.from(card.querySelectorAll('.student-badge .student-info span:last-child'))
          .map(span => `- ${span.innerText}`)
          .join('\n');
        text += `${title}\n${members}\n\n`;
      });

      const payload = text.trim();

      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(payload).then(() => {
          alert('Groups copied to clipboard!');
        }).catch(err => {
          fallbackCopy(payload, err);
        });
      } else {
        fallbackCopy(payload);
      }
    }

    function fallbackCopy(text, originalError) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try {
        const ok = document.execCommand('copy');
        if (!ok) throw new Error('execCommand returned false');
        alert('Groups copied to clipboard!');
      } catch (e) {
        console.error('Copy failed:', originalError || e);
        alert('Failed to copy. Please select and copy the results manually.');
      } finally {
        document.body.removeChild(ta);
      }
    }
  </script>
</body>
</html>

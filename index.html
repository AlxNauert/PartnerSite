<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A E S T H E T I C • Group Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff71ce;
      --secondary: #01cdfe;
      --accent: #05ffa1;
      --bg: #0d0221;
      --card-bg: rgba(26, 16, 60, 0.75);
      --text: #fffbfe;
      --text-muted: #b9aed9;
      --border: #b967ff;
      --input-bg: rgba(13, 2, 33, 0.8);
      --danger: #ff5277;
      --radius: 12px;
      --grid-color: rgba(255, 113, 206, 0.15);
      --glow: 0 0 12px rgba(255, 113, 206, 0.6);
      --male-color: #01cdfe;
      --female-color: #ff71ce;
      --neutral-color: #05ffa1;
    }

    [data-theme="light"] {
      --primary: #d9008f;
      --secondary: #0077ff;
      --accent: #00b874;
      --bg: #f3ebf9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --text: #2a0845;
      --text-muted: #6b5284;
      --border: #d9008f;
      --input-bg: #ffffff;
      --danger: #e60039;
      --grid-color: rgba(217, 0, 143, 0.12);
      --glow: 0 0 10px rgba(217, 0, 143, 0.3);
      --male-color: #0077ff;
      --female-color: #d9008f;
      --neutral-color: #00b874;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
      min-height: 100vh;
      transition: background-color 0.3s, color 0.3s;
      background-image: 
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
      background-size: 30px 30px;
      position: relative;
      overflow-x: hidden;
    }

    /* CRT Scanline overlay */
    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 4px;
      z-index: 999;
      pointer-events: none;
      opacity: 0.6;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      position: relative;
    }

    header h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(1.2rem, 4vw, 2.2rem);
      color: var(--primary);
      text-shadow: 2px 2px 0px var(--secondary), -2px -2px 0px #05ffa1;
      margin-bottom: 1rem;
      letter-spacing: -1px;
      line-height: 1.4;
    }

    header p {
      color: var(--secondary);
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-shadow: var(--glow);
    }

    .theme-toggle-btn {
      position: absolute;
      top: -10px;
      right: 0;
      background: var(--card-bg);
      color: var(--text);
      border: 2px solid var(--border);
      padding: 0.5rem 0.85rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: var(--glow);
      transition: all 0.2s;
      z-index: 20;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.05);
      border-color: var(--accent);
    }

    @media (max-width: 640px) {
      .theme-toggle-btn {
        position: static;
        margin: 0 auto 1rem;
        display: inline-flex;
      }
    }

    .app-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .app-layout {
        grid-template-columns: 360px 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 1.5rem;
      border-radius: var(--radius);
      border: 2px solid var(--border);
      box-shadow: var(--glow), inset 0 0 15px rgba(185, 103, 255, 0.15);
      transition: background-color 0.3s, border-color 0.3s;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
      font-size: 1rem;
      letter-spacing: 1px;
      color: var(--secondary);
      text-transform: uppercase;
    }

    textarea, input, select {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--input-bg);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: all 0.2s;
    }

    textarea {
      resize: vertical;
      min-height: 140px;
    }

    textarea:focus, input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .row-btn-group {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    /* FIX: prevent width:100% buttons from squashing siblings in flex rows */
    .row-btn-group .btn,
    .row-btn-group .btn-danger {
      width: auto;
      flex: 1;
      min-width: 0;
    }

    .radio-group {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.5rem;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), #b967ff);
      color: #ffffff;
      border: none;
      padding: 0.85rem;
      border-radius: 6px;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 15px var(--primary);
      transition: all 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px var(--primary);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
      box-shadow: none;
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border: 2px solid var(--danger);
      padding: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      transition: all 0.2s;
    }

    .btn-danger:hover {
      background-color: var(--danger);
      color: #ffffff;
      box-shadow: 0 0 12px var(--danger);
    }

    /* Gender Management Panel */
    .gender-editor {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem;
      margin-top: 0.75rem;
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .gender-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      user-select: none;
      transition: all 0.2s;
    }

    .gender-tag.male {
      background-color: rgba(1, 205, 254, 0.15);
      color: var(--male-color);
      border-color: var(--male-color);
    }

    .gender-tag.female {
      background-color: rgba(255, 113, 206, 0.15);
      color: var(--female-color);
      border-color: var(--female-color);
    }

    .gender-tag.unspecified {
      background-color: rgba(5, 255, 161, 0.15);
      color: var(--neutral-color);
      border-color: var(--neutral-color);
    }

    .gender-tag:hover {
      transform: scale(1.05);
    }

    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
    }

    .group-card {
      background: var(--card-bg);
      border: 2px solid var(--secondary);
      border-radius: 8px;
      padding: 1rem;
      box-shadow: 0 0 10px var(--secondary);
      transition: all 0.3s;
    }

    .group-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 20px var(--secondary);
    }

    .group-card h3 {
      font-family: 'Press Start 2P', monospace;
      font-size: 0.85rem;
      color: var(--primary);
      border-bottom: 2px solid var(--border);
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .group-card ul {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .student-badge {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      background-color: var(--input-bg);
      border-left: 5px solid var(--student-color, transparent);
      box-shadow:
        inset 0 0 5px rgba(255, 255, 255, 0.05),
        -2px 0 8px var(--student-color, transparent);
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }

    .student-info span:last-child {
      overflow-wrap: anywhere;
    }

    .student-color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
      background-color: var(--student-color, currentColor);
      box-shadow: 0 0 6px var(--student-color, currentColor);
    }

    .gender-icon {
      font-size: 0.85rem;
      font-weight: bold;
      flex-shrink: 0;
    }

    .actions-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .actions-bar h2 {
      font-family: 'Press Start 2P', monospace;
      font-size: 1rem;
      color: var(--accent);
      text-shadow: 0 0 8px var(--accent);
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 3rem 1rem;
      font-size: 1.1rem;
    }

    .divider {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--border), transparent);
      margin: 1.25rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <button class="theme-toggle-btn" onclick="toggleTheme()" id="themeToggleBtn" type="button">
        🌴 Switch to Light
      </button>
      <h1>R A N D O M • G R O U P S</h1>
      <p>// A E S T H E T I C • R O S T E R • S H U F F L E R</p>
    </header>

    <div class="app-layout">
      <!-- Input Panel -->
      <div class="card">
        
        <!-- Saved Classes Manager -->
        <div class="form-group">
          <label for="classSelect">Saved Rosters:</label>
          <select id="classSelect" onchange="loadClass()">
            <option value="">-- Select Class --</option>
          </select>
          <div class="row-btn-group" id="classActionButtons" style="display: none;">
            <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem;" onclick="updateClass()" type="button">Update Roster</button>
            <button class="btn-danger" style="font-size: 0.85rem; padding: 0.5rem;" onclick="deleteClass()" type="button">Delete</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label for="studentList">Student Names:</label>
          <textarea id="studentList" placeholder="Liam, Olivia, Noah, Emma, Oliver, Charlotte&#10;James, Amelia, Elijah, Sophia" oninput="onStudentInput()"></textarea>
          
          <div class="row-btn-group">
            <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem;" onclick="saveNewClass()" type="button">💾 Save Class Roster</button>
          </div>
        </div>

        <!-- Gender Sorting & Correction Panel -->
        <div class="form-group">
          <label>Gender Settings:</label>
          <button class="btn btn-secondary" style="font-size: 0.85rem; padding: 0.5rem;" onclick="toggleGenderEditor()" type="button">
            👤 Review & Assign Genders
          </button>
          
          <div id="genderEditorPanel" style="display: none;">
            <div class="gender-editor" id="genderTagContainer"></div>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem; text-align: center;">
              Click any badge to toggle: ♂ Male → ♀ Female → ⚧ Unspecified
            </p>
          </div>

          <label class="checkbox-label">
            <input type="checkbox" id="balanceGenders" checked> Balance Genders Across Groups
          </label>
        </div>

        <div class="divider"></div>

        <div class="form-group">
          <label>Grouping Mode:</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="mode" value="numGroups" checked onchange="toggleMode()"> Total Groups
            </label>
            <label class="radio-label">
              <input type="radio" name="mode" value="groupSize" onchange="toggleMode()"> Group Size
            </label>
          </div>
        </div>

        <div class="form-group">
          <label id="numberLabel" for="numberInput">Number of Groups:</label>
          <input type="number" id="numberInput" min="1" value="2">
        </div>

        <button class="btn" onclick="generateGroups()" type="button">⚡ Generate Groups</button>
      </div>

      <!-- Results Panel -->
      <div>
        <div class="actions-bar" id="actionsBar" style="display: none;">
          <h2 id="totalCount">GROUPS</h2>
          <button class="btn btn-secondary" style="width: auto; margin-top: 0; padding: 0.6rem 1rem;" onclick="copyGroups()" type="button">📋 Copy Results</button>
        </div>

        <div id="resultsContainer">
          <div class="card empty-state">
            <p>Load a roster or enter student names, then hit <strong>GENERATE GROUPS</strong>.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Built-In Name Dictionaries for Gender Detection ---
    const MALE_NAMES = new Set([
      "liam", "noah", "oliver", "james", "elijah", "william", "henry", "lucas", "benjamin", "theodore",
      "mateo", "levi", "sebastian", "daniel", "jack", "alexander", "owen", "asher", "samuel", "ethan",
      "leo", "jackson", "mason", "ezra", "john", "hudson", "luca", "david", "joseph", "julian", "luke",
      "waylon", "isaac", "jayden", "thomas", "anthony", "dylan", "lincoln", "charles", "christopher",
      "jaxon", "maverick", "josiah", "isaiah", "andrew", "elias", "joshua", "nathan", "caleb", "ryan",
      "adrian", "miles", "eli", "nolan", "christian", "aaron", "cameron", "ezekiel", "colton",
      "landon", "hunter", "jonathan", "santiago", "axel", "easton", "cooper", "jeremiah", "angel", "roman",
      "connor", "jameson", "robert", "greyson", "jordan", "ian", "carson", "jaxson", "leonardo", "nicholas",
      "dominic", "austin", "everett", "brooks", "xavier", "kai", "jose", "parker", "adam", "jace"
    ]);

    const FEMALE_NAMES = new Set([
      "olivia", "emma", "charlotte", "amelia", "sophia", "mia", "isabella", "ava", "evelyn", "elena",
      "harper", "luna", "camila", "gianna", "elizabeth", "eleanor", "ella", "violet", "abigail",
      "sophie", "avery", "scarlett", "emily", "hazel", "aria", "penelope", "chloe", "layla", "mila",
      "nora", "madison", "ellie", "lily", "nova", "isla", "grace", "aurora", "riley",
      "zoey", "willow", "emilia", "stella", "zoe", "victoria", "hannah", "addison", "leah", "lucy",
      "eliana", "ivy", "everly", "lillian", "paisley", "naomi", "maya", "natalie", "kinsley",
      "delilah", "claire", "audrey", "aaliyah", "ruby", "brooklyn", "alice", "aubrey", "autumn", "leilani",
      "savannah", "valentina", "kennedy", "madelyn", "skylar", "hailey", "serenity", "caroline", "allison",
      "gabriella", "anna", "sarah", "cora", "sadie", "piper", "lydia", "alexa", "josephine"
    ]);

    // Names whose suffix would mislead the heuristic — override to the correct gender.
    // (These are only reached if the name wasn't found in the dictionaries above.)
    const HEURISTIC_OVERRIDES = {
      // ends in 'a' but typically male
      "mika": "male", "josh": "male", "luca": "male", "nikola": "male",
      // ends in 'son' but typically female
      "madison": "female", "allison": "female", "addison": "female", "emerson": "unspecified",
      // ends in 'or' but typically female
      "taylor": "unspecified", "jordan": "unspecified",
      // ambiguous
      "casey": "unspecified", "riley": "unspecified", "avery": "unspecified", "quinn": "unspecified"
    };

    // Student Gender Map: Name -> 'male' | 'female' | 'unspecified'
    let studentGenderMap = {};

    // --- Gender Auto-Detection ---
    function autoDetectGender(name) {
      const firstName = name.trim().split(/\s+/)[0].toLowerCase();
      if (MALE_NAMES.has(firstName)) return 'male';
      if (FEMALE_NAMES.has(firstName)) return 'female';
      if (HEURISTIC_OVERRIDES[firstName]) return HEURISTIC_OVERRIDES[firstName];

      // Conservative suffix heuristics (only for names not otherwise classified)
      if (firstName.endsWith('ette') || firstName.endsWith('ina') || firstName.endsWith('ella')) return 'female';
      if (firstName.endsWith('son') && firstName.length > 4) return 'male';

      return 'unspecified';
    }

    function syncGenderMap(students) {
      const newMap = {};
      students.forEach(student => {
        newMap[student] = studentGenderMap[student] || autoDetectGender(student);
      });
      studentGenderMap = newMap;
      renderGenderEditor();
    }

    // Debounced input handler
    let inputDebounceTimer = null;
    function onStudentInput() {
      clearTimeout(inputDebounceTimer);
      inputDebounceTimer = setTimeout(() => {
        const rawInput = document.getElementById('studentList').value;
        const students = parseStudentNames(rawInput);
        syncGenderMap(students);
      }, 150);
    }

    function toggleGenderEditor() {
      const panel = document.getElementById('genderEditorPanel');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
      renderGenderEditor();
    }

    function renderGenderEditor() {
      const container = document.getElementById('genderTagContainer');
      const students = parseStudentNames(document.getElementById('studentList').value);

      if (students.length === 0) {
        container.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem;">No students entered yet.</span>';
        return;
      }

      // FIX: Use data-index + event delegation instead of interpolating names into onclick.
      // This eliminates both the apostrophe-breaking bug and the XSS vector.
      container.innerHTML = students.map((student, index) => {
        const gender = studentGenderMap[student] || 'unspecified';
        const symbol = gender === 'male' ? '♂' : gender === 'female' ? '♀' : '⚧';
        return `
          <div class="gender-tag ${gender}" data-index="${index}">
            <span>${symbol}</span>
            <span>${escapeHtml(student)}</span>
          </div>
        `;
      }).join('');
    }

    // Event delegation — attached once, survives re-renders.
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('genderTagContainer').addEventListener('click', (event) => {
        const tag = event.target.closest('.gender-tag');
        if (!tag) return;
        const index = parseInt(tag.dataset.index, 10);
        if (Number.isNaN(index)) return;
        cycleGenderByIndex(index);
      });
    });

    function cycleGenderByIndex(index) {
      const students = parseStudentNames(document.getElementById('studentList').value);
      const student = students[index];
      if (!student) return;

      const current = studentGenderMap[student] || 'unspecified';
      const next = current === 'male' ? 'female' : current === 'female' ? 'unspecified' : 'male';
      studentGenderMap[student] = next;
      renderGenderEditor();
    }

    // --- Theme Logic ---
    function initTheme() {
      const savedTheme = localStorage.getItem('theme');
      const isLight = savedTheme === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? 'light' : 'dark');
      updateThemeButton(isLight);
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme');
      const isLight = currentTheme === 'light';
      const newTheme = isLight ? 'dark' : 'light';

      document.documentElement.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeButton(!isLight);
    }

    // FIX: Clearer labels — the button describes the mode you'd switch TO.
    function updateThemeButton(isLight) {
      const btn = document.getElementById('themeToggleBtn');
      btn.textContent = isLight ? '🔮 Switch to Dark' : '🌴 Switch to Light';
    }

    initTheme();

    // --- Helper Functions ---
    function parseStudentNames(text) {
      return text
        .split(/[\n,]+/)
        .map(s => s.trim())
        .filter(s => s.length > 0);
    }

    function stringToColor(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const hue = Math.abs(hash * 137.508) % 360;
      return `hsl(${hue}, 100%, 65%)`;
    }

    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }

    // --- Saved Classes Management ---
    function getSavedClasses() {
      const saved = localStorage.getItem('classRosters');
      try {
        return saved ? JSON.parse(saved) : {};
      } catch (e) {
        console.warn('Failed to parse saved rosters, resetting.', e);
        return {};
      }
    }

    function renderClassDropdown() {
      const classes = getSavedClasses();
      const select = document.getElementById('classSelect');
      const currentSelection = select.value;

      select.innerHTML = '<option value="">-- Select Class --</option>';
      
      Object.keys(classes).sort().forEach(className => {
        const option = document.createElement('option');
        option.value = className;
        option.textContent = className;
        select.appendChild(option);
      });

      if (classes[currentSelection]) {
        select.value = currentSelection;
      }
      toggleActionButtons();
    }

    function loadClass() {
      const select = document.getElementById('classSelect');
      const className = select.value;
      const classes = getSavedClasses();

      if (className && classes[className]) {
        const data = classes[className];
        let students = [];
        if (Array.isArray(data)) {
          students = data;
          document.getElementById('studentList').value = students.join(', ');
          syncGenderMap(students);
        } else if (data.students) {
          students = data.students;
          document.getElementById('studentList').value = students.join(', ');
          studentGenderMap = data.genders || {};
          syncGenderMap(students);
        }
      }
      toggleActionButtons();
    }

    function saveNewClass() {
      const text = document.getElementById('studentList').value;
      const students = parseStudentNames(text);

      if (students.length === 0) {
        alert('Please enter student names before saving.');
        return;
      }

      const className = prompt('Enter a title for this roster:');
      if (!className || !className.trim()) return;

      const trimmedName = className.trim();
      const classes = getSavedClasses();

      if (classes[trimmedName] && !confirm(`"${trimmedName}" already exists. Overwrite?`)) {
        return;
      }

      classes[trimmedName] = {
        students: students,
        genders: studentGenderMap
      };
      localStorage.setItem('classRosters', JSON.stringify(classes));

      renderClassDropdown();
      document.getElementById('classSelect').value = trimmedName;
      toggleActionButtons();
      alert(`Roster "${trimmedName}" saved!`);
    }

    function updateClass() {
      const select = document.getElementById('classSelect');
      const className = select.value;

      if (!className) return;

      const students = parseStudentNames(document.getElementById('studentList').value);

      const classes = getSavedClasses();
      classes[className] = {
        students: students,
        genders: studentGenderMap
      };
      localStorage.setItem('classRosters', JSON.stringify(classes));

      alert(`Updated "${className}".`);
    }

    function deleteClass() {
      const select = document.getElementById('classSelect');
      const className = select.value;

      if (!className) return;

      if (confirm(`Delete roster "${className}"?`)) {
        const classes = getSavedClasses();
        delete classes[className];
        localStorage.setItem('classRosters', JSON.stringify(classes));

        document.getElementById('studentList').value = '';
        studentGenderMap = {};
        renderClassDropdown();
        renderGenderEditor();

        // FIX: clear stale results after deletion
        document.getElementById('resultsContainer').innerHTML =
          '<div class="card empty-state"><p>Load a roster or enter student names, then hit <strong>GENERATE GROUPS</strong>.</p></div>';
        document.getElementById('actionsBar').style.display = 'none';
      }
    }

    function toggleActionButtons() {
      const select = document.getElementById('classSelect');
      const actionButtons = document.getElementById('classActionButtons');
      actionButtons.style.display = select.value ? 'flex' : 'none';
    }

    renderClassDropdown();

    // --- Group Generator Logic ---
    function toggleMode() {
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const label = document.getElementById('numberLabel');
      const input = document.getElementById('numberInput');

      if (mode === 'numGroups') {
        label.textContent = 'Number of Groups:';
        input.value = 2;
      } else {
        label.textContent = 'Students per Group:';
        input.value = 3;
      }
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateGroups() {
      const students = parseStudentNames(document.getElementById('studentList').value);

      if (students.length === 0) {
        alert('Please enter at least one student name.');
        return;
      }

      const mode = document.querySelector('input[name="mode"]:checked').value;
      const targetVal = parseInt(document.getElementById('numberInput').value, 10);

      if (!targetVal || targetVal <= 0) {
        alert('Please enter a valid positive number.');
        return;
      }

      syncGenderMap(students);
      const balanceGender = document.getElementById('balanceGenders').checked;

      const groups = [];
      let numGroups;

      if (mode === 'groupSize') {
        numGroups = Math.max(1, Math.ceil(students.length / targetVal));
      } else {
        numGroups = Math.min(targetVal, students.length);
      }

      for (let i = 0; i < numGroups; i++) {
        groups.push([]);
      }

      if (balanceGender) {
        // Stratified round-robin distribution by gender category
        const males = shuffle(students.filter(s => (studentGenderMap[s] || 'unspecified') === 'male'));
        const females = shuffle(students.filter(s => (studentGenderMap[s] || 'unspecified') === 'female'));
        const unspecified = shuffle(students.filter(s => (studentGenderMap[s] || 'unspecified') === 'unspecified'));

        let groupIdx = 0;
        [males, females, unspecified].forEach(categoryList => {
          categoryList.forEach(student => {
            groups[groupIdx % numGroups].push(student);
            groupIdx++;
          });
        });
      } else {
        const shuffled = shuffle(students);
        shuffled.forEach((student, index) => {
          groups[index % numGroups].push(student);
        });
      }

      renderGroups(groups);
    }

    function renderGroups(groups) {
      const container = document.getElementById('resultsContainer');
      const actionsBar = document.getElementById('actionsBar');
      const totalCount = document.getElementById('totalCount');
      const currentClass = document.getElementById('classSelect').value || 'default';

      actionsBar.style.display = 'flex';
      totalCount.textContent = `// ${groups.length} GROUP${groups.length > 1 ? 'S' : ''} GENERATED`;

      let html = '<div class="groups-grid">';

      groups.forEach((group, index) => {
        // FIX: zero-pad group numbers so group 10 isn't shown as "010".
        const groupNumber = String(index + 1).padStart(2, '0');

        const membersHtml = group.map(student => {
          const color = stringToColor(`${currentClass}:${student.toLowerCase()}`);
          const gender = studentGenderMap[student] || 'unspecified';
          const icon = gender === 'male' ? '♂' : gender === 'female' ? '♀' : '⚧';
          const colorVar = gender === 'male' ? 'male-color'
                        : gender === 'female' ? 'female-color'
                        : 'neutral-color';

          // FIX: use a CSS custom property for the student color so we can combine
          // the inset shadow (from CSS) with the outer colored glow without one
          // clobbering the other. Also fixed the missing space that made the
          // original box-shadow declaration invalid.
          return `
            <li class="student-badge" style="--student-color: ${color};">
              <div class="student-info">
                <span class="student-color-dot"></span>
                <span>${escapeHtml(student)}</span>
              </div>
              <span class="gender-icon" style="color: var(--${colorVar});">
                ${icon}
              </span>
            </li>
          `;
        }).join('');

        html += `
          <div class="group-card">
            <h3>GROUP ${groupNumber}</h3>
            <ul>${membersHtml}</ul>
          </div>
        `;
      });

      html += '</div>';
      container.innerHTML = html;
    }

    function copyGroups() {
      const groupCards = document.querySelectorAll('.group-card');
      if (groupCards.length === 0) return;

      let text = '';
      groupCards.forEach(card => {
        const title = card.querySelector('h3').innerText;
        const members = Array.from(card.querySelectorAll('.student-badge .student-info span:last-child'))
          .map(span => `- ${span.innerText}`)
          .join('\n');
        text += `${title}\n${members}\n\n`;
      });

      const payload = text.trim();

      // FIX: fall back to execCommand when the Clipboard API isn't available
      // (e.g. file:// context where navigator.clipboard is undefined/insecure).
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(payload).then(() => {
          alert('Groups copied to clipboard!');
        }).catch(err => {
          fallbackCopy(payload, err);
        });
      } else {
        fallbackCopy(payload);
      }
    }

    function fallbackCopy(text, originalError) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.position = 'fixed';
      ta.style.top = '0';
      ta.style.left = '0';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try {
        const ok = document.execCommand('copy');
        if (!ok) throw new Error('execCommand returned false');
        alert('Groups copied to clipboard!');
      } catch (e) {
        console.error('Copy failed:', originalError || e);
        alert('Failed to copy. Please select and copy the results manually.');
      } finally {
        document.body.removeChild(ta);
      }
    }
  </script>
</body>
</html>
